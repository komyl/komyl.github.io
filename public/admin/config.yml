backend:
  name: git-gateway
  branch: main

editor:
  preview_style: "/admin/admin-styles.css"

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "src/content/blog"
    create: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "pubDate", widget: "datetime" }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "projects"
    label: "Projects"
    folder: "src/content/projects"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Project Name", name: "name", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["Commercial", "Personal & Academic"] }
      - { label: "Status", name: "status", widget: "select", options: ["active", "suspended", "finished"] }
      - { label: "Technologies", name: "technologies", widget: "list", required: false }
      - { label: "GitHub Repository URL", name: "url", widget: "string", required: false }
      - { label: "Duration", name: "duration", widget: "object", required: false,
          fields: [
            { label: "Value", name: "value", widget: "number", default: 1 },
            { label: "Unit", name: "unit", widget: "select", options: ["Day(s)", "Week(s)", "Month(s)", "Year(s)"], default: "Month(s)"}
          ]
        }
      - { label: "README Content", name: "body", widget: "markdown" }